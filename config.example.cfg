# ===============================================================
# Конфигурационный файл для Telegram Audio Deduplicator
# ===============================================================

[core]
# Список ID чатов для сканирования, через запятую.
chat_list = @music_shiz

# Режим симуляции. True = только отчет(в логе), False = реальное удаление.
dry_run = True

# Аналогично report создаёт файлы репорта(по умолчанию в exports_dir в {chat_id}) без удаления и верификации
report_only = True

# Удаление сообщений в личных чатах и обычных группах.
# True  -> Удалить для всех участников (по умолчанию).
# False -> Удалить только для себя.
# В супергруппах и каналах сообщения всегда удаляются для всех.
# Лучше не трогать, а то забудешь и будет прикол)
revoke_private_chats = True

# Приоритет выбора ОРИГИНАЛА в группе дубликатов (остальные удаляются).
# Критерии через запятую; следующий применяется при "ничьей" по предыдущему.
# Допуск ~N% расширяет ничью: largest ~ 3% = все в пределах 3% от максимума
# считаются равными и проходят дальше (знак % необязателен).
#   oldest / newest      — по message_id (допуск запрещён)
#   largest / smallest   — по file_size
#   longest / shortest   — по duration
#   best_meta            — запись с performer/title бьёт запись без них
#   longest_clean_name   — самое длинное имя после очистки от мусора
# Если oldest/newest не указан, oldest добавляется в конец автоматически.
# Пусто -> используется устаревший keep_newest_duplicate.
keep_priority = largest ~ 2%, best_meta, oldest

# УСТАРЕЛО: используется только если keep_priority пуст.
# False = оригиналом считается САМОЕ СТАРОЕ сообщение (по умолчанию).
# True = оригиналом считается САМОЕ НОВОЕ сообщение.
# keep_newest_duplicate = False


[ignore_list]
# Список игнорируемых message_id для каждого чата.
# Формат: chat_id = id1, id2, id3
-1001986217699 = 4973, 4660, 3621, 4238, 4015, 5321


[ignore_regex]
# Защита от удаления по регулярному выражению.
# Одна регулярка на строку (строки-продолжения — с отступом).
# Матчится через re.search по file_name, performer и title.
# Регистр: по умолчанию чувствителен, добавляйте (?i) при необходимости.
# Ключ * применяется ко всем чатам.
# * =
#     (?i)\blive\b
#     ^Мой сет
-1001986217699 =
    (?i) Король


[pyrogram]
# Ваши API ID и Hash от my.telegram.org
# Трижды подумайте, если захотите вставить от оф. клиента тележки
# Лучше в .env пишите
# api_id =
# api_hash =

# Имя файла сессии (например, "my_account").
# Будет создан файл my_account.session.
session_name = my_account

# Настройки прокси (оставьте пустым, если не нужно).
# Формат: scheme://user:pass@host:port
# Примеры:
# socks5://user:pass@127.0.0.1:1080
# http://127.0.0.1:8080
# https://t.me/proxy?server=...&port=...&secret=...
proxy_url = http://127.0.0.1:7897

# Максимальное время (в секундах), которое библиотека будет ждать АВТОМАТИЧЕСКИ.
# Если флуд больше этого значения, будет выброшено исключение FloodWait.
# Рекомендуется: 180-300 секунд. По умолчанию в библиотеке: 10 + что-то там
sleep_threshold = 300


[archive]
# Пересылать дубликаты в запасной чат ПЕРЕД удалением (страховка от потерь).
# True  -> сначала копия в архив, потом удаление. Если копия не удалась —
#          удаление пропускается (см. abort_delete_on_archive_failure).
# False -> сразу удаление, как раньше.
archive_before_delete = False

# Куда складывать копии.
# me / self        -> Избранное (Saved Messages).
# @username        -> канал/чат по юзернейму (в канал нужны права на постинг).
# -100...          -> числовой id.
# ВАЖНО: не указывай сюда чат, который сам есть в chat_list — иначе на
# следующем прогоне скрипт задедуплит собственный архив.
archive_target = me

# Способ переноса в архив:
# 'forward' -> пересылка по ссылке на файл. Дёшево, батчем (до 100 за раз),
#              сохраняет «переслано из ...» — видно, откуда пришёл дубль.
# 'copy'    -> отправка как нового сообщения, без следов пересылки. Медленнее
#              (по одному сообщению), нужно если хочешь "чистую" копию.
# Ни forward, ни copy НЕ обходят защищённый контент (has_protected_content) —
# такие сообщения переслать/скопировать нельзя, батч просто не удалится.
archive_mode = forward

# Прятать имя исходного отправителя (только при archive_mode = forward).
# False (по умолчанию) -> в архиве видно «переслано из <чат>». Для архива
#                         обычно полезно — это бесплатная пометка происхождения.
# True                 -> копия приходит без автора, как обычное сообщение.
# В режиме copy не действует (там автора и так нет).
archive_hide_sender = False

# Что делать, если архивация батча провалилась.
# True (рекомендуется) -> НЕ удалять этот батч (ничего не теряем, попробуем позже).
# False                -> удалять всё равно. Опасно: рискуешь удалить без копии.
abort_delete_on_archive_failure = True


[fuzzy_matching]
# Включить нечёткий поиск дубликатов (True/False).
# Если False - будет работать старый алгоритм (только полное совпадение).
enable = True

# Режим сравнения имен:
# 'sort' - Строгий. Сортирует слова. Безопасен для разных песен одного артиста.
# A B C == C B A (Порядок не важен).
# A B C != A B C D (Лишнее слово снижает балл)
# 'set'  - Агрессивный. Ищет пересечения. Хорош для поиска каверов и замусоренных имен.
# A B C == C B A (Порядок не важен).
# A B C == A B C D E F (Лишние слова игнорируются!)
matching_mode = set

# Порог похожести (от 0.0 до 1.0).
# 0.90 означает, что файлы должны совпадать на 90% по сумме критериев.
# Для начала рекомендую 0.90. Если пропускает дубли - опускайте до 0.85.
threshold = 0.9

# Максимальная разница в длительности (в секундах).
# Если разница больше этого значения, файлы даже не будут сравниваться.
max_duration_diff_sec = 3

# ===============================================================================
# НАСТРОЙКИ СТЕПЕНЕЙ (POWER)
# ===============================================================================
# Алгоритм считает отношение: (Меньшее_значение / Большее_значение).
# Затем это отношение возводится в степень (power).
#
# Как работает степень (p):
#  p = 1.0  (Линейно):  Разница в 2 раза дает 50% баллов. Справедливо и честно.
#  p > 1.0  (Строго):   Кривая выгибается ВНИЗ. Жестко штрафует даже за мелкие
#                       отличия. Идеально для поиска абсолютных клонов.
#  p < 1.0  (Лояльно):  Кривая выгибается ВВЕРХ (корень). "Подушка безопасности",
#                       которая прощает огромную разницу. Идеально для поиска
#                       одной песни в разных форматах (FLAC vs MP3).
#  p = 0 :              Счёт параметра станет равен 1.0.
#                       Параметр перестаёт влиять на результат.
#
# !!!!!! p < 0 - сломает алгоритм, поэтому запрещено !!!!!!
# ===============================================================================

# Степень для текстового сходства имени файла и аудио-метаданных.
# Формула: text_score = raw_fuzzy_score ** name_power (raw в 0.0..1.0).
#   1.0  — старое поведение;
#   >1.0 — строже: давит частичные совпадения 0.83–0.90
#          (один артист, разные треки, похожая длина/размер);
#   0..1 — мягче: усиливает частичные совпадения, выше риск ложных дублей.
# score=1.0 не меняется при любой степени. Должно быть > 0.
# Для музыкальной библиотеки разумно 1.3–1.6.
name_power = 1.5

# --- Оценка длительности ---
# Степень (p) для расчета совпадения длительности треков.
# Длительность объективна, поэтому здесь логично использовать p >= 1.0.
#
# ПРЕСЕТЫ:
# 1.0  - Мягко. Алгоритм почти не заметит разницу в 3-5 секунд для типичных треков.
# 3.0 - Золотая середина. Прощает тишину в конце трека, но режет балл за лишнее.
# 84.0 - Legacy Strict (Старое поведение). В связке с max_duration_diff_sec = 2
#        скрипт будет склеивать только клоны, штрафуя за каждую долю секунды.
# 0.5  - Режим "Ремикс". Если сильно увеличить max_duration_diff_sec, скрипт
#        начнет склеивать Radio Edit (3 мин) и Extended Mix (6 мин).
duration_power = 4.0

# --- Оценка размера ---
# Степень (p) для расчета совпадения размера файлов.
# Размер субъективен (зависит от битрейта и вшитых обложек), поэтому здесь
# рекомендуется ставить p <= 1.0.
#
# ПРЕСЕТЫ:
# 1.0  - По умолчанию. Идеально понимает, что треки в одном битрейте — это
#        дубликаты, даже если в один из них вшита обложка альбома на 1.5 МБ.
# 5.0  - Строгий контроль качества. Отличит 320 kbps от 128 kbps (и не склеит их).
# 0.2  - Режим "Плевать на формат". Простит разницу в размере в 10 раз!
#        Легко склеит FLAC (30 МБ) и MP3 (3 МБ), если их названия совпадают.
size_power = 0.9

# --- Веса критериев (сумма должна быть равна 1.0) ---

# Насколько важно совпадение имени (0.50 = 50% успеха зависит от имени)
weight_name = 0.50

# Насколько важно совпадение длительности
weight_duration = 0.30

# Насколько важно совпадение размера файла
weight_size = 0.20

# Штраф за несовпадение чисел
# Если множества чисел в названиях не совпадают, вычитаем это значение из итогового скора.
# Рекомендуемое значение: 0.05 (снижает 0.96 до 0.91, что ниже порога 0.95, например)
# Например при 0.01
# DEBUG -     [MATCH] Score: 0.968 (Penalty: -0.01) | Name: 0.96, Dur: 1.00, Size: 1.00 |
#  'j_s_bach_french_suite_no_3_in_b_minor,_bwv_814_5_menuet_i_6_menuet.mp3' <==> 'j_s_bach_french_suite_no_2_in_c_minor,_bwv_813_5_menuet_i_6_menuet.mp3'
# {2, 813, 5, 6} != {3, 814, 5, 6} -> Штраф
#
# DEBUG:     [MATCH] Score: 0.968 (Penalty: -0.01) | Name: 0.96, Dur: 1.00, Size: 1.00 | 'death note op 2 [nc].mp3' <==> 'death note op 1 [nc].mp3'
# {2} != {1} -> Штраф
penalty_numbers_mismatch = 0.08

# Включает "умный" штраф по мере Жаккара (Jaccard Index).
# Штраф = penalty_numbers_mismatch * (1 - пересечение / объединение)
#
# False (по умолчанию): Жесткий бинарный режим.
#     Любое несовпадение множеств = ПОЛНЫЙ штраф.
#     Пример с Бахом: {2, 813, 5, 6} != {3, 814, 5, 6} -> Штраф 100% (0.08).
#     Пример Death Note: {2} != {1} -> Штраф 100% (0.08).
#
# True: Мягкий пропорциональный режим.
#     Штраф уменьшается, если есть совпадающие числа.
#     Пример с Бахом:
#       Общие числа: {5, 6} (2 шт). Всего уникальных чисел: {2, 3, 813, 814, 5, 6} (6 шт).
#       Сходство: 2/6 = 0.33 (33%).
#       Итог: Применится только 67% штрафа -> 0.08 * 0.67 = ~0.053 (вместо 0.08).
#
#     Пример Death Note: {2} vs {1}
#       Общих чисел нет -> Сходство 0% -> Штраф 100% (0.08). (Работает так же строго).
use_jaccard_penalty = False

# Использовать метаданные трека (performer + title) при fuzzy-сравнении.
# True  -> кроме имени файла, сравниваются теги Telegram: исполнитель и название.
#          Проверяются варианты: имя-имя, имя-мета, мета-имя, мета-мета,
#          после чего берётся лучший результат с учётом штрафа за числа.
#          Полезно для файлов вроде audio_123.mp3, где имя мусорное,
#          но внутри прописаны нормальные Artist - Title.
# False -> старое поведение: fuzzy смотрит только на имя файла. Безопаснее,
#          если метаданные в коллекции часто кривые или случайные.
use_meta_fuzzy = True


[paths]
# Путь к каталогу для хранения резервных копий. Может быть абсолютным или относительным.
backup_dir = backup

# Имя файла базы данных SQLite.
db_file = music_library.sqlite

downloads_dir = downloads
exports_dir = exports
log_file = log/script_activity.log


[system_safety]
# Таймаут для ожидания lock-файла в секундах.
# Определяет, как долго скрипт будет ждать, если другая его копия уже запущена.
# 0      = не ждать, сразу выходить с ошибкой (рекомендуется для большинства случаев).
# -1     = ждать бесконечно, пока предыдущий процесс не завершится.
# >0     = ждать указанное количество секунд (например, 30.5).
lock_timeout = 0

# --- Проверка свободного места ---
# Если это значение > 0, будет выполнена простая проверка на указанное
# количество мегабайт свободного места. Динамический расчет ниже будет проигнорирован.
# Установите 0.0, чтобы включить умный динамический расчет.
min_free_space_mb = 0.0

# --- Настройки динамического расчета (когда min_free_space_gb = 0.0) ---
# Коэффициент умножается на размер, нужный для создания одного бэкапа.
# 1.5 = требуется место под 1 бэкап (100%) + 50% запаса на рост и расходы.
dynamic_space_coefficient = 1.5

# Дополнительный фиксированный буфер в мегабайтах.
dynamic_space_safety_buffer_mb = 8


[performance]
# Раз в сколько сообщений записывать в БД
sync_batch_size = 7000

# Количество сообщений, удаляемых из Telegram за один запрос.
batch_delete_size = 100

# Размер пакета для запроса информации о сообщениях (Telegram рекомендует до 200).
verify_chunk_size = 200

# Количество одновременных запросов на верификацию сообщений.
verify_concurrency = 5

# Размер кэша БД (в страницах). Отрицательное значение - в килобайтах.
# -256000 ~ 256 MB. Увеличьте, если ОЗУ позволяет.
db_cache_size = -256000


[backup]
# Включить создание резервной копии при запуске? (True/False)
backup_on_startup = False

# Создавать резервную копию только в том случае, если база данных изменилась с момента последнего бэкапа.
# Проверка идет по хэш-сумме содержимого файла.
# True - экономит место и время, если изменений не было.
# False - всегда создавать новый бэкап при запуске.
backup_only_if_changed = True

# Порядок операций:
#   False (по умолчанию) -> сначала создать новый бэкап, потом удалить/архивировать старые. Безопаснее.
#   True -> сначала удалить/архивировать старые, потом создать новый. Экономит место на диске.
rotate_before_backup = False

# Максимальное количество "горячих" (несжатых) бэкапов для хранения.
max_backups = 0

# Архивировать старые бэкапы в .xz вместо их удаления? (True/False)
archive_old_backups = True

# Уровень сжатия LZMA (от 0 до 9).
# 0-3 - быстро, 4-6 - средне, 7-9 - медленно, но максимальное сжатие.
lzma_preset = 9

# Максимальное количество сжатых архивов (.xz) для хранения.
# Самые старые архивы
max_archives = 4


[logging]
# Уровень логирования для консоли (DEBUG, INFO, WARNING, ERROR).
log_level_console = INFO

# Уровень логирования для файла (рекомендуется DEBUG для полной информации).
log_level_file = DEBUG

# Уровень логирования для pyrogram (рекомендуется WARNING или INFO).
log_level_pyrogram = INFO

# Максимальный размер лог-файла в байтах (здесь 2 MB).
log_max_bytes = 2097152

# Количество хранимых резервных копий лог-файла.
log_backup_count = 5

# Компоненты chat label:
# title    -> название чата / имя пользователя
# username -> @username, если есть
# id       -> числовой Telegram ID
chat_label_parts = title, username, id
