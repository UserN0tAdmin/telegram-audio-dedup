[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dedup"
version = "24.0.0"
description = "Поиск и удаление дубликатов аудиофайлов в Telegram-чатах"
authors = [{ name = "UserN0tAdmin" }]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fasteners>=0.20",
    "kurigram>=2.2.24",
    "python-dotenv>=1.2.2",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "pysocks>=1.7.1",
    "rapidfuzz>=3.14.5",
    "tgcrypto-pyrofork>=1.2.8",
    "wcwidth>=0.8.2",
    "mtproxy-bridge @ git+https://github.com/UserN0tAdmin/mtproxy-bridge.git",
    "uvloop>=0.22.1 ; sys_platform != 'win32'",
    "winloop>=0.5.0 ; sys_platform == 'win32'",
]

# Инструменты разработки; установка: pip install --group dev (pip >= 25.1)
# либо pip install -r requirements-dev.txt
[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "black>=26.5.1",
    "mypy>=2.3.0",
    "py-spy>=0.4.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "livedb: интеграционные тесты на копии живой БД music_library.sqlite (скип, если файла нет)",
]

# main.py остаётся точкой входа репозитория (python main.py) и в пакет не ставится
[tool.setuptools]
packages = ["dedup"]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W — pycodestyle, F — pyflakes, I — сортировка импортов, UP — pyupgrade,
# B — bugbear, C4 — comprehensions, SIM — simplify, RUF — ruff-специфичные,
# D — pydocstyle (Google-конвенция, см. ниже)
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "D"]
# Длинные SQL-строки и лог-сообщения не рвём — форматировщик их всё равно не переносит.
# RUF001-003 («неоднозначные юникод-символы») — ложные срабатывания на кириллице,
# кавычках « » и длинном тире в русскоязычных строках/докстрингах/комментариях.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"dedup/tcp_padded.py" = ["D", "UP006", "UP007", "UP035", "UP045"]
# В тестах докстринги не требуются: имена тестов самодостаточны
"tests/*" = ["D"]

[tool.ruff.format]
quote-style = "double"
