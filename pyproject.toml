[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dedup"
version = "0.1.0"
description = "Поиск и удаление дубликатов аудиофайлов в Telegram-чатах"
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
authors = [{ name = "UserN0tAdmin" }]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fasteners>=0.20",
    "kurigram>=2.2.25",
    "python-dotenv>=1.2.2",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "pysocks>=1.7.1",
    "rapidfuzz>=3.14.5",
    "tgcrypto-pyrofork>=1.2.8",
    "wcwidth>=0.8.2",
    "uvloop>=0.22.1 ; sys_platform != 'win32'",
    "winloop>=0.5.0 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
mtproxy = [
    "mtproxy-bridge @ git+https://github.com/UserN0tAdmin/mtproxy-bridge.git@0.3.5",
]

# Инструменты разработки; установка: pip install -e . --group dev (pip >= 25.1)
[dependency-groups]
dev = [
    "ruff>=0.16.3",
    "mypy>=2.3.0",
    "py-spy>=0.4.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "types-openpyxl>=3.1.5",
    "mutmut>=3.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "livedb: интеграционные тесты на копии живой БД music_library.sqlite (скип, если файла нет)",
]

[tool.mypy]
python_version = "3.12"

# У этих библиотек нет стабов и py.typed (winloop к тому же ставится только на Windows)
[[tool.mypy.overrides]]
module = [
    "fasteners",
    "fasteners.*",
    "mtproxy_bridge",
    "mtproxy_bridge.*",
    "winloop",
    "winloop.*",
]
ignore_missing_imports = true

[tool.setuptools]
packages = ["dedup"]
py-modules = ["main"]

[project.scripts]
dedup = "main:_bootstrap"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]

# E/W — pycodestyle, F — pyflakes, I — сортировка импортов, UP — pyupgrade,
# B — bugbear, C4 — comprehensions, SIM — simplify, RUF — ruff-специфичные,
# D — pydocstyle (Google-конвенция, см. ниже).

# ASYNC — блокирующие вызовы в корутинах: ядро проекта; тяжёлое уже в
#         to_thread, правило ловит новые нарушения;
# DTZ  — datetime без таймзоны (бэкапы/отчёты должны жить в UTC);
# S    — bandit: проглоченные исключения, assert в проде, подозрительные вызовы;
# PT   — гигиена pytest: составные assert, пустые yield-фикстуры;
# PERF — перф-антипаттерны (ручной цикл вместо extend/comprehension);
# PLE/PLW/PLC — pylint-наследие: ошибки, предупреждения, упрощения;
# T10  — забытый pdb.set_trace.

# PIE  — лишние pass/плейсхолдеры;
# FURB — refurb: точечные упрощения (тернарник вместо or и т.п.);
# RET  — superfluous-else-return и родственники;
# PTH  — унификация на pathlib: open() → Path.open(), os.remove → unlink;
# EXE  — exec-бит без шебанга (гигиена прав в git);
# NPY  — NumPy;
# N    — pep8-naming: camelCase-функции, PascalCase-переменные, битые алиасы
#         импортов — страховка;
# PGH  — голые `# noqa` / `# type: ignore` без кода правила;
# PLR1730/PLR5501 — единственные взятые из PLR: пороговые PLR09xx/PLR2004. # todo рассмотреть весь PLR
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "D",
          "ASYNC", "DTZ", "S", "PT", "PERF", "PLE", "PLW", "PLC", "T10",
          "PIE", "FURB", "RET", "PTH", "EXE", "NPY", "N", "PGH",
          "PLR1730", "PLR5501"]

ignore = [
    # Длинные SQL-строки и лог-сообщения не рвём — форматировщик их всё равно не переносит.
    "E501",
    # «Неоднозначные юникод-символы» — ложные срабатывания на кириллице, кавычках « »
    # и длинном тире в русскоязычных строках/докстрингах/комментариях.
    "RUF001", "RUF002", "RUF003",
    # SQL собирается из констант и имён таблиц из sqlite_master: идентификаторы
    # плейсхолдерами передать нельзя, все ЗНАЧЕНИЯ ходят через «?».
    "S608",
    # Ленивые импорты — осознанно: optional-зависимости с ImportError-fallback
    "PLC0415",
    # Одиночные Path.exists()-стражи в async — микросекундный stat() на локальной ФС;
    # обёртка в to_thread стоила бы дороже самого вызова. Тяжёлые операции
    # (read_text, rglob, save) правило продолжает ловить.
    #"ASYNC240", # todo рассмотреть
    # Локальные UPPER-константы внутри функций (W_NAME, CHUNK, EXCEL_MAX_*, ...)
    # — осознанный стиль проекта: константа живёт рядом с единственным потребителем.
    "N806",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Тесты: докстринги не требуются (имена тестов самодостаточны); S — ассерты
# и есть тесты (481 находка на весь набор); фикстуры синхронно трогают ФС,
# naive-datetime — контракт SQLite-слоя.
"tests/*" = ["D", "S", "ASYNC", "DTZ"]
# Единственный законный global: реестр конфигурации прогона.
"dedup/context.py" = ["PLW0603"]

[tool.ruff.format]
quote-style = "double"

[tool.mutmut]
source_paths = ["dedup"]
only_mutate = [
    "dedup/fuzzy.py",
    "dedup/priority.py",
    "dedup/cleaning.py",
    "dedup/utils.py",
    "dedup/duplicates.py",
    "dedup/search.py",
    "dedup/state.py",
]
cache_invalidation_files = ["tests/*.py"]
on_dependency_change = "rerun"
max_children = 6